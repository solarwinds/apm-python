# Build development environments (manylinux x86 or aarch, 64-bit)
# to locally build and publish solarwinds_apm Python APM library
services:
  x86_64:
    image: solarwinds/apm-python-manylinux-x86_64:local
    build:
      context: .
      dockerfile: Dockerfile.manylinux
      args:
        MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
    stdin_open: true
    tty: true
    network_mode: host
    cap_add:
      - ALL
    volumes:
      - ./:/code/solarwinds_apm
    working_dir: /code/solarwinds_apm
    entrypoint: ["/bin/bash", "-c"]
    command: 
    - |
       # build for sdist builds
       # boto3 for interaction with AWS
       # twine to upload to TestPyPi
       # tox for automated tests
       python3.10 -m pip install --upgrade pip
       python3.10 -m pip install --default-timeout=100 build boto3 twine tox
       /bin/bash

  aarch64:
    image: solarwinds/apm-python-manylinux-aarch64:local
    build:
      context: .
      dockerfile: Dockerfile.manylinux
      args:
        MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_aarch64
    stdin_open: true
    tty: true
    network_mode: host
    cap_add:
      - ALL
    volumes:
      - ./:/code/solarwinds_apm
    working_dir: /code/solarwinds_apm
    entrypoint: ["/bin/bash", "-c"]
    command: 
    - |
       # build for sdist builds
       # boto3 for interaction with AWS
       # twine to upload to TestPyPi
       # tox for automated tests
       python3.10 -m pip install --upgrade pip
       python3.10 -m pip install --default-timeout=100 build boto3 twine tox
       /bin/bash
